name: Pull and Deploy Frontend to Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_pull:
    name: Run Pull
    runs-on: ubuntu-latest

    steps:
      - name: Notify Start
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚀 **Запуск деплоя на dev-окружение**
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ github.ref }}`
            Автор: `${{ github.actor }}`
            Коммит: `${{ github.event.head_commit.message }}`
            🔗 [Открыть коммит](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

      - name: Install SSH keys
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: ssh-keyscan -p ${{ secrets.DEV_SSH_PORT }} -H ${{ secrets.DEV_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Connect and Deploy
        run: |
          ssh -A -p ${{ secrets.DEV_SSH_PORT }} ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} << 'EOF'
          set -e

          cd ${{ secrets.DEV_WORK_DIR }}

          git fetch origin
          git checkout dev
          git reset --hard origin/dev

          rm -f .env
          touch .env
          echo "VITE_API_BASE_URL=${{ secrets.DEV_VITE_API_BASE_URL }}" >> .env
          echo "VITE_API_FRONTEND_URL=${{ secrets.DEV_VITE_API_FRONTEND_URL }}" >> .env
          echo "VITE_ENVIRONMENT=${{ secrets.DEV_VITE_ENVIRONMENT }}" >> .env

          npm install
          npm run build:prod

          if [ ! -d "dist" ]; then
            echo "dist folder not found after build"
            exit 1
          fi

          rm -rf ${{ secrets.DEV_FE_DIST_DIR }}/*
          cp -r dist/* ${{ secrets.DEV_FE_DIST_DIR }}/

          EOF

      - name: Notify Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ✅ **Деплой на dev-окружение завершён успешно**
            🔗 [Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ❌ **Ошибка при деплое на dev-окружение**
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ github.ref }}`
            🔗 [Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Cleanup
        run: rm -rf ~/.ssh